name: Build and test InternBridge

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: Version for the JAR artifact, for example 0.2.0
        type: string
        required: false

permissions:
  contents: read

jobs:
  packaged-app:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PYTHONUTF8: '1'
      GETJOBS_TEST_BROWSER: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: front/package.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Java tests and build the JAR
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          $gradle = if ($IsWindows) { './gradlew.bat' } else { './gradlew' }
          $options = @('--no-daemon', '--console=plain')
          if ($env:RELEASE_VERSION) {
            if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+(-[A-Za-z0-9][A-Za-z0-9.-]*)?$') {
              throw 'Expected a version such as 0.2.0 or 0.2.1-rc.1.'
            }
            $options += "-PreleaseVersion=$env:RELEASE_VERSION"
          }
          & $gradle @options test bootJar
          exit $LASTEXITCODE
      - name: Install Chromium for browser tests
        run: |
          python -m pip install playwright==1.60.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($IsLinux) { python -m playwright install --with-deps chromium }
          else { python -m playwright install chromium }
          exit $LASTEXITCODE
      - name: Verify a fresh installation from the JAR
        run: |
          $jar = Get-ChildItem -Path 'build/libs/internbridge-*.jar' | Select-Object -First 1
          if (-not $jar) { throw 'The executable JAR is missing.' }
          python bin/smoke-package.py $jar.FullName --browser-tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $jar.FullName).Hash.ToLowerInvariant()
          "$sha  $($jar.Name)" | Set-Content -Encoding ascii -LiteralPath ($jar.FullName + '.sha256')
      - uses: actions/upload-artifact@v4
        with:
          name: internbridge-${{ runner.os }}
          path: |
            build/libs/internbridge-*.jar
            build/libs/internbridge-*.jar.sha256
          if-no-files-found: error

  documentation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run docs:build

name: Publish student workspace
on:
  push:
    branches: [main]
    paths: ['front/public/workspace/**', '.github/workflows/deploy-docs.yml', 'LICENSE', 'tests/workspace.test.cjs']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/workspace.test.cjs
      - uses: actions/configure-pages@v5
      - run: cp LICENSE front/public/workspace/LICENSE.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: front/public/workspace
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
